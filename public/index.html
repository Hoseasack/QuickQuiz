<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light" />
  <title>QuickQuiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header: shown always -->
  <div class="header">
    <div id="app-title"><h1>QuickQuiz</h1><p>A better way to quiz!</p></div>
    <div id="slogan"></div>
<!--    <div id="theme-label"><p>Theme Selector</p></div>
    <div class="theme-switch"> 
      <label class="switch">
        <input type="checkbox" id="color-scheme-dark" name="theme"/>
        <span class="slider round"></span>
      </label>
    </div> -->

      
      <fieldset class="toggle-group" id="colorScheme">
        <h4 id="theme-label">Theme Selector</h4>
        <label><input type="radio" name="color-scheme" id="color-scheme-light" value="0" data-sr>Light</label>
        <label><input type="radio" name="color-scheme" value="auto" checked data-sr> Auto</label>
        <label><input type="radio" name="color-scheme" id="color-scheme-dark" value="1" data-sr> Dark</label>
      </fieldset>

  </div>

  <div id="app">

    <!-- Drop zone: shown when no quiz is loaded -->
    <div id="drop-zone">
      <p class="drop-zone__heading">Drop a <code>.quiz</code> file here</p>
      <p class="drop-zone__or">or</p>
      <label for="file-input" class="btn">Choose File</label>
      <input type="file" id="file-input" accept=".quiz" hidden>
      <p id="file-error" class="error" hidden></p>
    </div>

    <!-- Quiz view: shown when a quiz is loaded -->
    <div id="quiz-view" hidden>
      <div id="score-banner" class="score-banner" role="status" hidden></div>
      <div id="warning-banner" class="warning-banner" role="note" hidden></div>

      <header id="quiz-header">
        <h1 id="quiz-title"></h1>
        <h4 id="quiz-author"></h4>
        <p id="quiz-description"></p>
        <p id="quiz-count"></p>
      </header>

      <form id="quiz-form">
        <ol id="question-list"></ol>
        <div id="quiz-actions">
          <button type="submit" id="submit-btn" disabled>Submit</button>
          <button type="button" id="retake-btn" hidden>Retake</button>
          <button type="button" id="home-btn" >Back to Home</button>
        </div>
      </form>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
